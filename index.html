<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>العمدة - الكاشير</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0f">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-title" id="storeName">العمدة</div>
  <div class="topbar-actions">
    <a href="admin.html"><button>⚙️ الإدارة</button></a>
  </div>
</header>

<main class="cashier-layout">

  <!-- المنتجات -->
  <section class="card">
    <h2>الأصناف</h2>
    <div id="categories" class="categories"></div>
    <div id="items" class="items-grid"></div>
  </section>

  <!-- الفاتورة -->
  <section class="card">
    <h2>الفاتورة</h2>

    <div id="cart" class="cart-list">
      <div class="empty-cart">السلة فاضية</div>
    </div>

    <div class="totals">
      <div class="totals-row">
        <span>المجموع الفرعي</span>
        <span id="subtotal">0.000</span>
      </div>
      <div class="totals-row" id="taxRow">
        <span>الضريبة</span>
        <span id="taxAmount">0.000</span>
      </div>
      <div class="totals-row grand">
        <span>الإجمالي</span>
        <span id="total">0.000</span>
      </div>
    </div>

    <button onclick="completeOrder()" class="btn success" id="completeBtn">
      ✨ إتمام الطلب
    </button>
  </section>

</main>

<script type="module" src="app.js"></script>

</body>
</html>
