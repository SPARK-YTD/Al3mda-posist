<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>العمدة - الإدارة</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#faf6f0">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h2>تسجيل دخول الإدارة</h2>

    <label>اسم المستخدم</label>
    <input type="text" id="loginUsername" autocomplete="username" />

    <label>كلمة المرور</label>
    <input type="password" id="loginPassword" autocomplete="current-password" />

    <div id="loginError" class="login-error" style="display:none"></div>

    <button onclick="doLogin()" class="btn success" style="margin-top:20px">
      دخول
    </button>

    <div class="login-back">
      <a href="index.html">← رجوع للكاشير</a>
    </div>
  </div>
</div>

<!-- تطبيق الإدارة -->
<div id="adminApp" class="admin-layout" style="display:none">

  <aside class="admin-sidebar">
    <h2>الإدارة</h2>
    <button data-tab="products" class="active">📦 المنتجات</button>
    <button data-tab="categories">📁 الفئات</button>
    <button data-tab="modifiers">🧩 الإضافات</button>
    <button data-tab="sales">💰 المبيعات</button>
    <button data-tab="settings">⚙️ الإعدادات</button>
    <button data-tab="logout" style="margin-top:30px;color:var(--danger)">🚪 تسجيل خروج</button>
    <button onclick="location.href='index.html'" style="background:var(--bg-hover);color:var(--gold);border:1px solid var(--border-gold)">🛒 الكاشير</button>
  </aside>

  <main class="admin-main">
    <div id="tabContent"></div>
  </main>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
